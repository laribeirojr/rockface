H_FB_INPROGRAM = "In the programs: Help → Send feedback… (Petro) or the Send feedback… button (Atlas, Explorer, Lab, MC)."
H_FAQ = "FAQ"
H_FAQ_TITLE = "Questions, answered plainly."
H_FAQ1_Q = "Who can use RockFace now?"
H_FAQ1_A = "RockFace is in a testing phase: the installers go to invited testers. Public downloads start with version 1.0, which comes after the testers' feedback."
H_FAQ2_Q = "Is my data sent anywhere?"
H_FAQ2_A = "No. The programs run on your computer; a project is a file, or a database on your team's server. Mio's language model runs on your computer too. The feedback form only opens in your browser."
H_FAQ3_Q = "In which languages?"
H_FAQ3_A = "English, Portuguese and Spanish: the interface, this guide and the reports. The language can be changed at any time in View → Language."
H_FAQ4_Q = "Where does the nomenclature come from?"
H_FAQ4_A = "From the published literature. Every term, scale and classification has its source, shown in the program; your team may add terms of its own."
H_FAQ5_Q = "Can I automate it?"
H_FAQ5_A = "Yes. Every function is reachable from Python through the RockFace API: in the script window, from the command line or in Jupyter. Each guide page has a <em>From a script</em> section."
H_FINAL_EYEBROW = "Start with the example"
H_FINAL_TITLE = "Open the illustrative example and look around."
H_FINAL_TEXT = "The guide walks through every function with invented samples marked ILLUSTRATIVE."

