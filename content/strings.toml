H_FB_PENDING = "The feedback form is being prepared and will be linked here. In the programs, <strong>Help → Send feedback…</strong> (Petro) and the <strong>Send feedback…</strong> button (Atlas, Explorer, Lab and MC) open it as soon as it is defined."
