H_FAQ1_A = "RockFace está en fase de pruebas: los instaladores van a probadores invitados. Las descargas públicas empiezan con la versión 1.0, que llega después de la opinión de los probadores."
H_FAQ2_Q = "¿Se envían mis datos a algún lugar?"
H_FAQ2_A = "No. Los programas funcionan en su computadora; un proyecto es un archivo, o una base de datos en el servidor de su equipo. El modelo de lenguaje de Mio también funciona en su computadora. El formulario de opinión solo se abre en su navegador."
H_FAQ3_Q = "¿En qué idiomas?"
H_FAQ3_A = "Inglés, portugués y español: la interfaz, esta guía y los informes. El idioma se puede cambiar en cualquier momento en Ver → Idioma."
H_FAQ4_Q = "¿De dónde viene la nomenclatura?"
H_FAQ4_A = "De la literatura publicada. Cada término, escala y clasificación tiene su fuente, mostrada en el programa; su equipo puede añadir términos propios."
H_FAQ5_Q = "¿Se puede automatizar?"
H_FAQ5_A = "Sí. Toda función es accesible desde Python mediante la API de RockFace: en la ventana de scripts, desde la línea de comandos o en Jupyter. Cada página de la guía tiene una sección <em>Desde un script</em>."
H_FINAL_EYEBROW = "Empiece por el ejemplo"
H_FINAL_TITLE = "Abra el ejemplo ilustrativo y explore."
H_FINAL_TEXT = "La guía recorre cada función con muestras inventadas marcadas ILLUSTRATIVE."
