# RockFace Suite website settings (read by scripts/build_site.py and scripts/build_manual.py).

[site]
origin = "https://laribeirojr.github.io"
base_path = "/rockface"

[rockface]
# the version whose guide is published (the guide pages and pictures come from that version)
version = "1.0.0rc5"
# the testers' feedback form (Microsoft Forms of the RockFace team); empty until the form is defined
feedback_url = ""
# the downloads (GitHub releases of the installers; private during the testing phase: invited testers only)
downloads_url = "https://github.com/laribeirojr/rockface-releases/releases"
